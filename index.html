<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>SOURCE Skirmish</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6 56 20v24L32 58 8 44V20Z' fill='%23152238' stroke='%237ec8ff' stroke-width='3'/%3E%3Cpath d='M32 18 44 32 32 46 20 32Z' fill='%23ffb020'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="app">
      <section id="lobby" class="overlay">
        <div class="panel lobby-panel">
          <p class="eyebrow">hex fleet skirmish</p>
          <h1>SOURCE Skirmish</h1>
          <p class="lede">Three ships. Secret orders. Reveal, move, and fire on a shared hex grid. No account — just a room code.</p>
          <label class="field">
            <span>Callsign</span>
            <input id="name" maxlength="14" placeholder="Rook" autocomplete="off" />
          </label>
          <div class="row-btns lobby-actions">
            <button id="btn-create" class="btn primary" type="button">Create room</button>
            <button id="btn-practice" class="btn" type="button">Practice vs bot</button>
            <button id="btn-how" class="btn ghost" type="button">How to play</button>
          </div>
          <div class="join-row">
            <input id="code" maxlength="6" placeholder="ROOM" spellcheck="false" autocomplete="off" class="code-input" />
            <button id="btn-join" class="btn" type="button">Join</button>
          </div>
          <label class="check">
            <input id="spectator" type="checkbox" />
            <span>Join as spectator</span>
          </label>
        </div>
      </section>

      <section id="waiting" class="overlay hidden">
        <div class="panel wait-panel">
          <p class="eyebrow">room code</p>
          <div class="code-hero">
            <span id="wait-code">----</span>
            <button id="btn-copy" class="btn tiny" type="button">Copy</button>
          </div>
          <p id="wait-role" class="muted"></p>
          <ul id="wait-list" class="wait-list"></ul>
          <div id="bot-row" class="bot-row hidden">
            <span>Bots</span>
            <button id="btn-bots-less" class="btn tiny" type="button" aria-label="Fewer bots">−</button>
            <strong id="bot-count">0</strong>
            <button id="btn-bots-more" class="btn tiny" type="button" aria-label="More bots">+</button>
          </div>
          <div id="seat-row" class="row-btns hidden"></div>
          <div class="row-btns">
            <button id="btn-start" class="btn primary hidden" type="button">Launch</button>
            <button id="btn-leave" class="btn ghost" type="button">Leave</button>
          </div>
          <p class="hint">2–4 pilots. Share the code, or add a bot. Spectators can swap in for a bot or take an open seat.</p>
        </div>
      </section>

      <section id="hud" class="hud hidden">
        <header class="hud-top">
          <div class="chip">
            <span>Room</span>
            <strong id="hud-code"></strong>
          </div>
          <div class="turn-banner"><span id="phase-text">Fitting</span></div>
          <div class="chip sound-chip">
            <label class="volume"><input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume" /></label>
            <button id="btn-mute" class="icon-btn" type="button" aria-label="Mute">🔊</button>
            <button id="btn-help" class="icon-btn" type="button" aria-label="Help">?</button>
            <button id="btn-hand" class="icon-btn" type="button">My cards</button>
            <button id="dock-toggle" class="icon-btn" type="button">Orders</button>
            <button id="btn-quit" class="icon-btn" type="button">Leave</button>
          </div>
        </header>
        <aside id="roster" class="roster"></aside>
        <aside id="log" class="log"></aside>
        <div id="dock" class="dock"></div>
      </section>

      <div id="modal" class="overlay hidden"></div>
    </div>
    <div id="toast"></div>
    <div id="hex-tip" class="hex-tip hidden" role="tooltip"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
